server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Ukuran maksimal upload — sesuaikan dengan kebutuhan berkas PMB/skripsi
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
         fastcgi_pass app:9000;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;

    fastcgi_read_timeout 120;

    fastcgi_buffer_size 64k;
    fastcgi_buffers 8 64k;
    fastcgi_busy_buffers_size 128k;
    }

    # Blokir akses langsung ke file sensitif
    location ~ /\.(?!well-known) {
        deny all;
    }
    location ~* \.(env|log|sql|md)$ {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Catatan: subdomain terpisah untuk dashboard sinkron PDDIKTI (jika nanti
    # diperlukan) ditambahkan sebagai server block baru di file ini — belum
    # dibuat karena keputusan arsitektur PDDIKTI masih menunggu spesifikasi
    # Neo Feeder.
}
