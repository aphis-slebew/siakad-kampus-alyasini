<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1060" width="1360" height="1060" style="background:#ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a" />
    </marker>
  </defs>

  <rect x="30" y="30" width="1300" height="1000" fill="#ffffff" stroke="#0f172a" stroke-width="2" rx="4" />

  <!-- Headers -->
  <rect x="30" y="30" width="325" height="50" fill="#f8fafc" stroke="#0f172a" stroke-width="2" />
  <text x="192" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">CALON MAHASISWA</text>

  <rect x="355" y="30" width="335" height="50" fill="#f8fafc" stroke="#0f172a" stroke-width="2" />
  <text x="522" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">PANITIA PMB</text>

  <rect x="690" y="30" width="335" height="50" fill="#f8fafc" stroke="#0f172a" stroke-width="2" />
  <text x="857" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">ADMIN AKADEMIK (BAA)</text>

  <rect x="1025" y="30" width="305" height="50" fill="#f8fafc" stroke="#0f172a" stroke-width="2" />
  <text x="1177" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">SISTEM SIAKAD</text>

  <!-- Dividers -->
  <line x1="355" y1="80" x2="355" y2="1030" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="690" y1="80" x2="690" y2="1030" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="1025" y1="80" x2="1025" y2="1030" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- 1 START ONLY -->
  <rect x="137" y="105" width="110" height="38" rx="19" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
  <text x="192" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">START</text>

  <!-- CM1 -->
  <rect x="82" y="170" width="220" height="48" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="192" y="191" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Isi Formulir PMB Online</text>
  <text x="192" y="208" text-anchor="middle" font-size="11" fill="#475569">Biodata, NIK & Pilihan Prodi</text>

  <!-- S1 -->
  <rect x="1067" y="170" width="220" height="48" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="1177" y="191" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Cek NIK & Terbitkan Akun</text>
  <text x="1177" y="208" text-anchor="middle" font-size="11" fill="#475569">Role: calon_mahasiswa</text>

  <!-- CM2 -->
  <rect x="82" y="260" width="220" height="48" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="192" y="281" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Unggah Berkas Pendaftaran</text>
  <text x="192" y="298" text-anchor="middle" font-size="11" fill="#475569">Ijazah, KK, KTP, Pasfoto</text>

  <!-- P1: Decision -->
  <polygon points="522,250 622,280 522,310 422,280" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="522" y="277" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Verifikasi Berkas?</text>
  <text x="522" y="292" text-anchor="middle" font-size="10" fill="#475569">Panitia Cek Fisik/Scan</text>

  <!-- P2 -->
  <rect x="412" y="355" width="220" height="48" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="522" y="376" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Jadwalkan & Ujian Masuk</text>
  <text x="522" y="393" text-anchor="middle" font-size="11" fill="#475569">Pelaksanaan Tes Seleksi</text>

  <!-- P3: Decision -->
  <polygon points="522,445 622,475 522,505 422,475" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="522" y="472" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Hasil Seleksi Masuk?</text>
  <text x="522" y="487" text-anchor="middle" font-size="10" fill="#475569">Input Nilai & Kelulusan</text>

  <!-- S2 -->
  <rect x="1067" y="550" width="220" height="48" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="1177" y="571" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Publikasi Pengumuman</text>
  <text x="1177" y="588" text-anchor="middle" font-size="11" fill="#475569">Portal PMB & Surat Kelulusan</text>

  <!-- CM3 -->
  <rect x="82" y="640" width="220" height="48" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="192" y="661" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Her-Registrasi & UKT Awal</text>
  <text x="192" y="678" text-anchor="middle" font-size="11" fill="#475569">Unggah Dokumen Fisik & Bukti</text>

  <!-- BAA1: Decision -->
  <polygon points="857,635 957,665 857,695 757,665" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="857" y="662" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Validasi Her-Reg?</text>
  <text x="857" y="677" text-anchor="middle" font-size="10" fill="#475569">BAA & Keuangan Cek</text>

  <!-- S3 -->
  <rect x="1067" y="745" width="220" height="48" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="1177" y="766" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Service Konversi Mahasiswa</text>
  <text x="1177" y="783" text-anchor="middle" font-size="11" fill="#475569">Generate NIM & Akun Aktif</text>

  <!-- CM4: Final Status -->
  <rect x="82" y="860" width="220" height="48" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="192" y="881" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Terima Hasil & Kredensial</text>
  <text x="192" y="898" text-anchor="middle" font-size="11" fill="#475569">Terdaftar Resmi / Arsip</text>

  <!-- 1 END ONLY -->
  <rect x="137" y="960" width="110" height="38" rx="19" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
  <text x="192" y="984" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">END</text>

  <!-- Connectors -->
  <path d="M 192 143 L 192 170" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
  <path d="M 302 194 L 1067 194" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
  <path d="M 1177 218 L 1177 240 L 192 240 L 192 260" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
  
  <!-- CM2 -> P1 -->
  <path d="M 302 284 L 422 284" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- P1 (Tidak Valid) -> CM2 -->
  <path d="M 522 310 L 522 335 L 192 335 L 192 308" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <rect x="330" y="325" width="80" height="18" fill="#ffffff" />
  <text x="370" y="338" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Perlu Revisi</text>

  <!-- P1 (Valid) -> P2 -->
  <path d="M 522 310 L 522 355" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
  <path d="M 522 403 L 522 445" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- P3 (Lulus) -> S2 -->
  <path d="M 622 475 L 1177 475 L 1177 550" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="870" y="465" width="60" height="18" fill="#ffffff" />
  <text x="900" y="478" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Lulus</text>

  <!-- P3 (Tidak Lulus) -> CM4 (Rejoin to single END) -->
  <path d="M 422 475 L 50 475 L 50 884 L 82 884" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <rect x="40" y="600" width="80" height="18" fill="#ffffff" />
  <text x="80" y="613" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Tidak Lulus</text>

  <!-- S2 -> CM3 -->
  <path d="M 1067 574 L 192 574 L 192 640" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- CM3 -> BAA1 -->
  <path d="M 302 664 L 757 664" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- BAA1 (Belum) -> CM3 -->
  <path d="M 857 695 L 857 720 L 192 720 L 192 688" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)" />

  <!-- BAA1 (Sah) -> S3 -->
  <path d="M 957 665 L 1177 665 L 1177 745" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="1040" y="655" width="60" height="18" fill="#ffffff" />
  <text x="1070" y="668" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Lengkap</text>

  <!-- S3 -> CM4 -->
  <path d="M 1177 793 L 1177 820 L 192 820 L 192 860" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- CM4 -> 1 END -->
  <path d="M 192 908 L 192 960" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
</svg>