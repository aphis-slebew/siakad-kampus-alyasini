<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 870" width="1100" height="870" style="background:#ffffff; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a" />
    </marker>
  </defs>

  <rect x="30" y="30" width="1040" height="810" fill="#ffffff" stroke="#0f172a" stroke-width="2" rx="4" />

  <!-- Headers -->
  <rect x="30" y="30" width="346" height="50" fill="#f8fafc" stroke="#0f172a" stroke-width="2" />
  <text x="203" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" letter-spacing="1">PENGGUNA (SEMUA ROLE)</text>

  <rect x="376" y="30" width="347" height="50" fill="#f8fafc" stroke="#0f172a" stroke-width="2" />
  <text x="549" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" letter-spacing="1">SUPERADMIN (IT)</text>

  <rect x="723" y="30" width="347" height="50" fill="#f8fafc" stroke="#0f172a" stroke-width="2" />
  <text x="896" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" letter-spacing="1">SISTEM SIAKAD</text>

  <!-- Dividers -->
  <line x1="376" y1="80" x2="376" y2="840" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="723" y1="80" x2="723" y2="840" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- 1 START ONLY -->
  <rect x="148" y="105" width="110" height="38" rx="19" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
  <text x="203" y="129" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">START</text>

  <!-- P1 -->
  <rect x="93" y="175" width="220" height="48" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="203" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Akses Halaman Login</text>
  <text x="203" y="213" text-anchor="middle" font-size="11" fill="#475569">Rute: /login</text>

  <!-- P2 -->
  <rect x="93" y="255" width="220" height="48" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="203" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Input Kredensial Akun</text>
  <text x="203" y="293" text-anchor="middle" font-size="11" fill="#475569">Email/NIM & Password</text>

  <!-- S1: Decision -->
  <polygon points="896,245 996,275 896,305 796,275" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="896" y="272" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Cek Rate Limiting?</text>
  <text x="896" y="287" text-anchor="middle" font-size="10" fill="#475569">(Fortify Throttling)</text>

  <!-- S2: Decision -->
  <polygon points="896,350 996,380 896,410 796,380" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="896" y="377" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Validasi Hash Password?</text>
  <text x="896" y="392" text-anchor="middle" font-size="10" fill="#475569">(Bcrypt Match)</text>

  <!-- S3 -->
  <rect x="786" y="455" width="220" height="48" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="896" y="476" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Inisialisasi Sesi Login</text>
  <text x="896" y="493" text-anchor="middle" font-size="11" fill="#475569">Muat Role & Permissions</text>

  <!-- SA1 -->
  <rect x="439" y="545" width="220" height="48" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="549" y="566" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Opsi Impersonasi Superadmin</text>
  <text x="549" y="583" text-anchor="middle" font-size="11" fill="#475569">Bantu Selesaikan Kendala</text>

  <!-- P3 -->
  <rect x="93" y="645" width="220" height="48" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="203" y="666" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Masuk Dashboard & Layanan</text>
  <text x="203" y="683" text-anchor="middle" font-size="11" fill="#475569">Sesi Aktif / Logout</text>

  <!-- P_Final -->
  <rect x="93" y="725" width="220" height="42" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="203" y="750" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Penutupan Sesi & Audit Log</text>

  <!-- 1 END ONLY -->
  <rect x="148" y="795" width="110" height="36" rx="18" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
  <text x="203" y="818" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">END</text>

  <!-- Connectors -->
  <path d="M 203 143 L 203 175" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
  <path d="M 203 223 L 203 255" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- P2 -> S1 (Across) -->
  <path d="M 313 275 L 796 275" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="520" y="264" width="70" height="20" fill="#ffffff" />
  <text x="555" y="278" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Kirim Form</text>

  <!-- S1 -> S2 (Aman) -->
  <path d="M 896 305 L 896 350" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="866" y="318" width="60" height="18" fill="#ffffff" />
  <text x="896" y="331" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Aman</text>

  <!-- S1 (Limit) -> P1 (Loopback) -->
  <path d="M 996 275 L 1030 275 L 1030 185 L 313 185" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <rect x="990" y="215" width="80" height="18" fill="#ffffff" />
  <text x="1030" y="228" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Terkunci</text>

  <!-- S2 -> S3 (Valid) -->
  <path d="M 896 410 L 896 455" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="866" y="423" width="60" height="18" fill="#ffffff" />
  <text x="896" y="436" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Valid</text>

  <!-- S2 (Salah) -> P2 (Loopback) -->
  <path d="M 796 380 L 330 380 L 330 290 L 313 290" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <rect x="490" y="370" width="80" height="18" fill="#ffffff" />
  <text x="530" y="383" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Sandi Salah</text>

  <!-- S3 -> SA1 -->
  <path d="M 896 503 L 896 525 L 549 525 L 549 545" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- S3 -> P3 (Direct Normal) -->
  <path d="M 786 480 L 710 480 L 710 655 L 313 655" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="470" y="645" width="90" height="18" fill="#ffffff" />
  <text x="515" y="658" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Login Normal</text>

  <!-- SA1 -> P3 -->
  <path d="M 549 593 L 549 665 L 313 665" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="380" y="655" width="100" height="18" fill="#ffffff" />
  <text x="430" y="668" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Mode Bantuan</text>

  <!-- P3 -> P_Final -->
  <path d="M 203 693 L 203 725" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- P_Final -> 1 END -->
  <path d="M 203 767 L 203 795" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
</svg>