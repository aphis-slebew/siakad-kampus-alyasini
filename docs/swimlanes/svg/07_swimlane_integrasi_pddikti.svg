  <path d="M 325 194 L 480 194" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
  <path d="M 700 194 L 865 194" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />

