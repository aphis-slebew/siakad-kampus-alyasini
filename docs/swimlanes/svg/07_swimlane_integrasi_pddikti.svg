  <text x="590" y="601" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Simpan ID Feeder ke Record</text>
  <text x="590" y="618" text-anchor="middle" font-size="11" fill="#475569">Tandai Status SYNCED</text>

  <!-- A3: Final Status -->
  <rect x="105" y="680" width="220" height="48" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="215" y="701" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Tinjau Rekonsiliasi & Audit</text>
  <text x="215" y="718" text-anchor="middle" font-size="11" fill="#475569">Laporan Sinkronisasi Berhasil</text>

  <!-- 1 END ONLY -->
