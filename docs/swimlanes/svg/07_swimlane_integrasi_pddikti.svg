  <text x="215" y="208" text-anchor="middle" font-size="11" fill="#475569">Klik: Test Connection</text>

  <!-- S1 -->
  <rect x="480" y="170" width="220" height="48" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="590" y="191" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Kirim Request Ping Token</text>
  <text x="590" y="208" text-anchor="middle" font-size="11" fill="#475569">Autentikasi Web Service</text>

  <!-- F1: Decision -->
  <polygon points="965,160 1065,190 965,220 865,190" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="965" y="187" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Koneksi Berhasil?</text>
  <text x="965" y="202" text-anchor="middle" font-size="10" fill="#475569">Respons Server Feeder</text>

  <!-- A2 -->
  <rect x="105" y="270" width="220" height="48" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="215" y="291" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Pilih Entitas & Eksekusi Batch</text>
  <text x="215" y="308" text-anchor="middle" font-size="11" fill="#475569">Mahasiswa, KRS, Nilai, AKM</text>

  <!-- S2: Decision -->
  <polygon points="590,260 690,290 590,320 490,290" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="590" y="287" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Field Wajib Lengkap?</text>
  <text x="590" y="302" text-anchor="middle" font-size="10" fill="#475569">Validasi Lokal</text>

