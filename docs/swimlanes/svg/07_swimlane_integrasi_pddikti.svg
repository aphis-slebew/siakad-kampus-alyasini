  <text x="965" y="402" text-anchor="middle" font-size="10" fill="#475569">Aturan Bisnis Kementerian</text>

  <!-- S4 -->
  <rect x="480" y="480" width="220" height="48" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.8" />
  <text x="590" y="501" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Catat Log Error (pddikti_logs)</text>
  <text x="590" y="518" text-anchor="middle" font-size="11" fill="#475569">Tandai Status FAILED</text>

  <!-- S5 -->
