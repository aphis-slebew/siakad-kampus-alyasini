  <rect x="560" y="130" width="80" height="18" fill="#ffffff" />
  <text x="600" y="143" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Gagal Token</text>

  <!-- F1 (Sukses) -> A2 -->
  <path d="M 965 220 L 965 240 L 215 240 L 215 270" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="560" y="230" width="80" height="18" fill="#ffffff" />
  <text x="600" y="243" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Terhubung</text>

  <!-- A2 -> S2 -->
  <path d="M 325 294 L 490 294" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- S2 (Data Kurang) -> S4 -->
  <path d="M 690 290 L 730 290 L 730 504 L 700 504" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <rect x="700" y="380" width="70" height="18" fill="#ffffff" />
  <text x="735" y="393" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Anomali</text>

  <!-- S2 (Lengkap) -> S3 -->
  <path d="M 590 320 L 590 370" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- S3 -> F2 -->
  <path d="M 700 390 L 865 390" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- F2 (Gagal) -> S4 -->
  <path d="M 965 420 L 965 504 L 700 504" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="800" y="494" width="70" height="18" fill="#ffffff" />
  <text x="835" y="507" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Ditolak</text>

  <!-- F2 (Sukses) -> S5 -->
  <path d="M 1065 390 L 1100 390 L 1100 604 L 700 604" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
  <rect x="1060" y="480" width="60" height="18" fill="#ffffff" />
  <text x="1090" y="493" text-anchor="middle" font-size="10" font-weight="600" fill="#0f172a">Sukses</text>

  <!-- S4 (Retry) -> A3 -->
  <path d="M 480 504 L 350 504 L 350 704 L 325 704" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)" />

  <!-- S5 -> A3 -->
  <path d="M 480 604 L 215 604 L 215 680" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />

  <!-- A3 -> 1 END -->
  <path d="M 215 728 L 215 790" fill="none" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)" />
